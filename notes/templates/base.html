{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sticky Notes — FAST NUCES</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        * { font-family: 'Poppins', sans-serif; }
        body { background: #0f0f1a; color: #e0e0e0; min-height: 100vh; }
        .navbar-custom { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); border-bottom: 2px solid #00d4ff33; padding: 12px 30px; box-shadow: 0 4px 20px rgba(0,212,255,0.1); }
        .navbar-brand-text { font-size: 1.4rem; font-weight: 700; color: #00d4ff !important; letter-spacing: 1px; }
        .uni-logo { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #00d4ff; object-fit: cover; }
        .nav-btn { border-radius: 20px; padding: 6px 18px; font-size: 0.85rem; font-weight: 600; transition: all 0.3s; }
        .nav-btn:hover { transform: translateY(-2px); }
        .profile-pic-nav { width: 38px; height: 38px; border-radius: 50%; border: 2px solid #00d4ff; object-fit: cover; }
        .note-card { border-radius: 16px; box-shadow: 4px 4px 15px rgba(0,0,0,0.4); transition: transform 0.3s; border: none; }
        .note-card:hover { transform: translateY(-6px); }
        .note-title { font-weight: 700; color: #1a1a1a; }
        .note-content { color: #333; font-size: 0.9rem; }
        .page-title { color: #00d4ff; font-weight: 700; font-size: 1.8rem; }
        .card-dark { background: #1a1a2e; border: 1px solid #00d4ff33; border-radius: 16px; }
    </style>
</head>
<body>
<nav class="navbar-custom d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center gap-3">
        <img src="{% static 'notes/logo.png' %}" class="uni-logo" alt="Logo">
        <span class="navbar-brand-text">📝 Sticky Notes</span>
    </div>
    <div class="d-flex align-items-center gap-2">
        {% if user.is_authenticated %}
            {% if user.userprofile.profile_picture %}
                <img src="{{ user.userprofile.profile_picture.url }}" class="profile-pic-nav" alt="Profile">
            {% endif %}
            <span class="text-info fw-semibold me-2">{{ user.username }}</span>
            <a href="{% url 'note_create' %}" class="btn btn-warning nav-btn"><i class="bi bi-plus-lg"></i> New Note</a>
            <a href="{% url 'note_list' %}" class="btn btn-outline-info nav-btn"><i class="bi bi-sticky"></i> My Notes</a>
            <form method="post" action="{% url 'logout' %}" style="display:inline">
                {% csrf_token %}
                <button class="btn btn-outline-danger nav-btn"><i class="bi bi-box-arrow-right"></i> Logout</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}" class="btn btn-outline-info nav-btn">Login</a>
            <a href="{% url 'register' %}" class="btn btn-warning nav-btn">Register</a>
        {% endif %}
    </div>
</nav>
<div class="container mt-4">
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
