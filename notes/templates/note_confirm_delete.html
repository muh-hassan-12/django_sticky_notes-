{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card-dark p-5 text-center shadow-lg">
      <i class="bi bi-trash3-fill" style="font-size:4rem;color:#dc3545;"></i>
      <h3 class="mt-3" style="color:#fff;">Delete Note?</h3>
      <p style="color:#aaa;">
        "<strong style="color:#00d4ff;">{{ note.title }}</strong>" permanently delete ho jayega!
      </p>
      <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-3 justify-content-center mt-3">
          <button class="btn btn-danger fw-bold px-4" style="border-radius:12px;">
            <i class="bi bi-trash"></i> Haan, Delete karo
          </button>
          <a href="{% url 'note_list' %}" class="btn btn-outline-secondary px-4" style="border-radius:12px;">
            Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
