{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card-dark p-5 shadow-lg">
      <div class="text-center mb-4">
        <img src="/static/notes/logo.png"
             style="width:80px;height:80px;border-radius:50%;border:3px solid #00d4ff;" alt="Logo">
        <h2 class="mt-3" style="color:#00d4ff;font-weight:700;">Welcome Back</h2>
        <p style="color:#888;">Sign in to your Sticky Notes</p>
      </div>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label" style="color:#aaa;">Username</label>
          <input name="username" type="text" class="form-control"
                 style="background:#0f0f1a;color:#fff;border:1px solid #00d4ff55;" placeholder="Enter username">
        </div>
        <div class="mb-3">
          <label class="form-label" style="color:#aaa;">Password</label>
          <input name="password" type="password" class="form-control"
                 style="background:#0f0f1a;color:#fff;border:1px solid #00d4ff55;" placeholder="Enter password">
        </div>
        {% if form.errors %}
        <div class="alert alert-danger">Invalid username or password.</div>
        {% endif %}
        <button class="btn btn-warning w-100 fw-bold mt-2" style="border-radius:12px;padding:12px;">
          <i class="bi bi-box-arrow-in-right"></i> Login
        </button>
      </form>
      <p class="text-center mt-3" style="color:#888;">
        No account? <a href="{% url 'register' %}" style="color:#00d4ff;">Register here</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
